<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro - Z Animation</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Poppins:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="./estilos/styleIndex.css" />
    <link rel="stylesheet" href="./estilos/styleRegistrar.css" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="imagenes/letra-z.png"
    />

    <script type="text/javascript">
      (function (c, l, a, r, i, t, y) {
        c[a] =
          c[a] ||
          function () {
            (c[a].q = c[a].q || []).push(arguments);
          };
        t = l.createElement(r);
        t.async = 1;
        t.src = "https://www.clarity.ms/tag/" + i;
        y = l.getElementsByTagName(r)[0];
        y.parentNode.insertBefore(t, y);
      })(window, document, "clarity", "script", "wovxlyzofq");
    </script>
  </head>
  <body>
    <!-- Sección de Registro -->
    <section class="registro-section">
      <div class="header-registro">
        <h1 class="registro-titulo-main" id="reg-titulo-hola">¡Hola!</h1>
        <p class="registro-subtitle-main" id="reg-subtitle-alegra">
          Nos alegra tenerte aquí
        </p>
      </div>

      <div class="registro-form-container">
        <div class="registro-card">
          <form id="registroFormulario">
            <!-- Usuario -->
            <div class="form-group">
              <label
                for="reg-usuario"
                class="form-label-registro"
                data-i18n="reg-label-usuario"
                >Usuario</label
              >
              <input
                type="text"
                class="form-input-registro"
                id="reg-usuario"
                data-placeholder-id="reg-usuario-placeholder"
                placeholder="Tu nombre de usuario"
                required
              />
            </div>

            <!-- Email -->
            <div class="form-group">
              <label
                for="reg-email"
                class="form-label-registro"
                data-i18n="reg-label-email"
                >Email</label
              >
              <input
                type="email"
                class="form-input-registro"
                id="reg-email"
                data-placeholder-id="reg-email-placeholder"
                placeholder="tu@email.com"
                required
              />
            </div>

            <!-- Contraseña -->
            <div class="form-group">
              <label
                for="reg-pass"
                class="form-label-registro"
                data-i18n="reg-label-pass"
                >Contraseña</label
              >
              <div class="password-wrapper">
                <input
                  type="password"
                  class="form-input-registro"
                  id="reg-pass"
                  data-placeholder-id="reg-pass-placeholder"
                  placeholder="Mínimo 8 caracteres"
                  required
                />
                <button
                  type="button"
                  class="toggle-pass-btn"
                  data-target="reg-pass"
                  aria-label="Mostrar contraseña"
                >
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>

            <!-- Botón Crear Cuenta -->
            <button type="submit" class="btn-registro" id="reg-btn-crear">
              Crear Cuenta
            </button>
          </form>

          <!-- Link a Login -->
          <div class="link-login">
            <span data-i18n="reg-link-signin">¿Ya tienes cuenta?</span>
            <a href="./login.html" data-i18n="reg-link-signin-btn"
              >Inicia sesión aquí</a
            >
          </div>
        </div>
      </div>
    </section>

    <script src="./js/language.js"></script>
    <script src="./js/notifications.js"></script>
    <script>
      // Redirigir si ya hay sesión activa
      (function () {
        try {
          if (JSON.parse(localStorage.getItem("z_sesion"))) {
            window.location.replace("./index.html");
          }
        } catch (e) {}
      })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script para efectos de inputs -->
    <script>
      const passInput = document.getElementById("reg-pass");
      passInput.addEventListener("input", () => {
        passInput.classList.toggle("filled", passInput.value.length > 0);
      });

      // Toggle mostrar/ocultar contraseña
      document.querySelectorAll(".toggle-pass-btn").forEach((btn) => {
        btn.addEventListener("click", function () {
          const input = document.getElementById(this.dataset.target);
          const icon = this.querySelector("i");
          if (input.type === "password") {
            input.type = "text";
            icon.className = "bi bi-eye-slash";
            this.setAttribute("aria-label", "Ocultar contraseña");
          } else {
            input.type = "password";
            icon.className = "bi bi-eye";
            this.setAttribute("aria-label", "Mostrar contraseña");
          }
        });
      });

      // Validación del formulario
      document
        .getElementById("registroFormulario")
        .addEventListener("submit", (e) => {
          e.preventDefault();

          const usuario = document.getElementById("reg-usuario").value.trim();
          const email = document.getElementById("reg-email").value.trim();
          const pass = document.getElementById("reg-pass").value;

          if (!usuario || !email || !pass) {
            ZNotify.camposObligatorios();
            return;
          }

          if (pass.length < 8) {
            ZNotify.passwordCorta();
            return;
          }

          // Guardar usuario en localStorage
          const usuarios = JSON.parse(
            localStorage.getItem("z_usuarios") || "[]",
          );
          const yaExiste = usuarios.find((u) => u.email === email);
          if (yaExiste) {
            ZNotify.emailYaRegistrado();
            return;
          }
          usuarios.push({ usuario, email, password: pass, avatar: null });
          localStorage.setItem("z_usuarios", JSON.stringify(usuarios));

          ZNotify.registroExitoso(usuario);

          // Redirigir al login tras el toast
          setTimeout(() => {
            window.location.href = "./login.html";
          }, 1800);
        });

      // Efectos en inputs
      document.querySelectorAll(".form-input-registro").forEach((input) => {
        input.addEventListener("focus", function () {
          this.closest(".form-group").style.transform = "translateY(-2px)";
        });
        input.addEventListener("blur", function () {
          this.closest(".form-group").style.transform = "translateY(0)";
        });
        if (input.value.length > 0) input.classList.add("filled");
      });
    </script>
  </body>
</html>
